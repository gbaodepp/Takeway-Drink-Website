{% extends "base.html" %}
{% block title %}Admin Login — SipCo{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="text-center mb-5">
    <div style="width:70px;height:70px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1rem;">☕</div>
    <h1 style="font-family:'Playfair Display',serif;font-size:1.9rem;color:var(--dark);">Welcome Back</h1>
    <p class="text-muted" style="font-size:0.9rem;">Sign in to manage your SipCo store</p>
  </div>

  <div class="form-card">
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <div style="position:relative;">
          <i class="bi bi-person" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);"></i>
          <input type="text" id="username" name="username" class="form-control"
                 style="padding-left:2.5rem;" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <i class="bi bi-lock" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);"></i>
          <input type="password" id="password" name="password" class="form-control"
                 style="padding-left:2.5rem;" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:0.85rem;font-size:1rem;">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center;">
      <p class="text-muted mb-1" style="font-size:0.82rem;">Default demo credentials:</p>
      <code style="font-size:0.82rem;background:var(--surface-2);padding:0.3rem 0.8rem;border-radius:6px;">
        admin / admin123
      </code>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="{{ url_for('index') }}" class="text-muted" style="font-size:0.88rem;">
      <i class="bi bi-arrow-left me-1"></i> Back to Store
    </a>
  </div>
</div>
{% endblock %}
